# SmartBite CV taxonomy v3 — planning taxonomy, not a trained model label map.
# Contains 150 food classes plus the separate not_food rejection label.
# Never use this file to interpret an existing ONNX output index. Existing production indices
# are defined by the exact training manifest/checkpoint that produced that ONNX model.
# Unknown food is an inference outcome, not a supervised food class.
version: 3
food_class_count: 150
special_labels:
  - id: not_food
    display: Not food
    purpose: Reject non-food images; keep separate from unknown food.
unknown_policy:
  output: unknown_food
  is_trained_class: false
  action: Ask user to choose or retake image; never force nearest known class.
class_id_policy: Stable IDs use food.<slug>; output indices are assigned only when a specific training manifest is frozen.
