# Visual classes the model predicts. List order = label index; do not reorder after training.
# `slug` is the stable ID used everywhere (Phase 2 maps slug -> Firestore foodID).
# `variants` are the foods the user can pick after a match (look-alikes merged into one visual class).
# `sources`: one-key maps {dataset_id: folder glob relative to that dataset's root} (see data.yaml).
classes:
  # ---------------- South Asian ----------------
  - slug: biryani
    display: Biryani
    variants: [Chicken biryani, Beef/mutton biryani, Vegetable biryani]
    sources:
      - sourav80: Indian Food Images/Indian Food Images/biryani
      - anshul: Biryani-resize/resize
      - pkdishes: dataset/dataset/biryani
      - food20: food20dataset/*/biriyani
  - slug: samosa
    display: Samosa
    variants: [Aloo samosa, Chicken/keema samosa]
    sources:
      - food101: images/samosa
      - pkdishes: dataset/dataset/samosa
      - l33t20: Food Classification/samosa
      - food20: food20dataset/*/samosa
  - slug: naan
    display: Naan
    variants: [Plain naan, Butter naan, Garlic naan]
    sources:
      - sourav80: Indian Food Images/Indian Food Images/naan
      - anshul: Naan-Resized/Naan-Resized
      - l33t20: Food Classification/butter_naan
      - food20: food20dataset/*/butternaan
  - slug: roti_chapati
    display: Roti / chapati
    variants: [Chapati, Tandoori roti]
    sources:
      - sourav80: Indian Food Images/Indian Food Images/chapati
      - pkdishes: dataset/dataset/chapati
      - l33t20: Food Classification/chapati
      - food20: food20dataset/*/chappati
  - slug: paratha
    display: Paratha
    variants: [Plain paratha, Aloo paratha]
    sources:
      - pkdishes: dataset/dataset/paratha
  - slug: daal
    display: Daal
    variants: [Daal chana, Daal masoor, Daal mash, Daal makhani]
    sources:
      - sourav80: Indian Food Images/Indian Food Images/dal_makhani
      - sourav80: Indian Food Images/Indian Food Images/dal_tadka
      - anshul: dal_resized/dal_resized
      - l33t20: Food Classification/dal_makhani
  - slug: curry_karahi
    display: Curry / karahi
    variants: [Chicken karahi, Mutton karahi, Chicken curry (salan), Butter chicken, Paneer karahi]
    sources:
      - food101: images/chicken_curry
      - sourav80: Indian Food Images/Indian Food Images/butter_chicken
      - sourav80: Indian Food Images/Indian Food Images/chicken_tikka_masala
      - sourav80: Indian Food Images/Indian Food Images/kadai_paneer
      - pkdishes: dataset/dataset/butter_chicken
      - l33t20: Food Classification/kadai_paneer
  - slug: haleem
    display: Haleem
    variants: [Beef haleem, Chicken haleem]
    sources:
      - pkdishes: dataset/dataset/haleem
  - slug: chicken_tikka
    display: Chicken tikka / tandoori
