      - sourav80: Indian Food Images/Indian Food Images/chana_masala
      - anshul: Chole-Bhature-Resized/Chole-Bhature-Resized
      - l33t20: Food Classification/chole_bhature
  - slug: jalebi
    display: Jalebi
