      - sourav80: Indian Food Images/Indian Food Images/chicken_tikka
      - pkdishes: dataset/dataset/chicken_tikka
      - food20: food20dataset/*/tandoori chicken
  - slug: pakora
    display: Pakora
    variants: [Vegetable pakora, Onion pakora]
    sources:
      - anshul: pakora-resize/pakora-resize
      - l33t20: Food Classification/pakode
  - slug: chana_chole
    display: Chanay / chole
    variants: [Chana masala, Chole with puri/bhatura]
