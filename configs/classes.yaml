    sources:
      - sourav80: Indian Food Images/Indian Food Images/jalebi
      - anshul: Jalebi-Resize/Jalebi-Resize
      - l33t20: Food Classification/jalebi
  - slug: gulab_jamun
    display: Gulab jamun
