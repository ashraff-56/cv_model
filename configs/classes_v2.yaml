# v2 visual classes: every usable dish of the Pakistani SMF dataset + the v1 classes + not_food.
# List order = label index; do not reorder after training. `slug` is the stable ID (Phase 2 maps slug -> foodID).
# `variants` are what the user picks after a match (look-alikes merged into one visual class).
# `sources`: one-key maps {dataset_id: folder glob relative to that dataset's root} (see data_v2.yaml).
# Merges: only near-identical meat variants (karahi, korma). SMF falooda/kulfi (1 image each) are not usable
# as sources; those dishes come from Khana / v1 data. v1 `halwa` was split into gajar/suji halwa (food20's
# mixed `halwa` folder dropped); v1 `curry_karahi` became `chicken_curry` now that karahi has its own class.
classes:
  # ---------------- rice, breads, savoury snacks ----------------
  - slug: biryani
    display: Biryani
    variants: [Chicken biryani, Beef/mutton biryani, Vegetable biryani]
    sources:
      - khana: khana/biryani
      - sourav80: Indian Food Images/Indian Food Images/biryani
      - anshul: Biryani-resize/resize
      - pkdishes: dataset/dataset/biryani
      - food20: food20dataset/*/biriyani
  - slug: naan
    display: Naan
    variants: [Plain naan, Butter naan, Garlic naan]
    sources:
      - khana: khana/garlic naan
      - sourav80: Indian Food Images/Indian Food Images/naan
      - anshul: Naan-Resized/Naan-Resized
      - l33t20: Food Classification/butter_naan
      - food20: food20dataset/*/butternaan
      - smf: SMF-DataSet-Flat/naan
