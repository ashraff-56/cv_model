# Curated nutrition source per model class. tools/build_nutrition.py reads the numbers from the
# downloaded databases (never typed by hand) and writes nutrition/nutrition.csv.
#
# Source priority: (1) USDA FoodData Central FNDDS 2021-2023 (survey foods, release 2024-10-31);
# (2) UK CoFID 2021 (McCance & Widdowson's integrated dataset); (3) INDB (Indian Nutrient Databank,
# recipe-calculated). approximate: true whenever the row is not a direct USDA match for the dish
# (other database, or a stand-in food). Merged visual classes use their most common Pakistani
# variant; the user can pick a different variant in Phase 2.
#
# serving: FNDDS portion description to use as defaultServingGrams (exact text), or for non-FNDDS
# rows a portion from another documented source.
# crosscheck: the same dish in a second database. Its value is recorded next to the primary one,
# and a row is flagged approximate automatically when the two differ by more than 30%.
foods:
  biryani:        {db: fndds, id: 2706538, serving: "1 cup", approximate: false, crosscheck: {db: cofid, id: "19-454"}}
  samosa:         {db: fndds, id: 2708730, serving: "Quantity not specified", approximate: false, crosscheck: {db: cofid, id: "15-305"}}
  naan:           {db: fndds, id: 2707613, serving: "1 Naan (10\" dia)", approximate: false, crosscheck: {db: cofid, id: "11-973"}}
  roti_chapati:   {db: fndds, id: 2707713, serving: "1 medium chappatti or roti (7\")", approximate: false, crosscheck: {db: cofid, id: "11-987"}}
  paratha:        {db: fndds, id: 2707715, serving: "1 paratha", approximate: false, crosscheck: {db: cofid, id: "11-1104"}}
  daal:           {db: fndds, id: 2707427, serving: "1 cup", approximate: false}
  curry_karahi:
    db: fndds
    id: 2706437
    serving: "1 cup"
    approximate: true
    crosscheck: {db: indb, id: ASC240}
    note: "Chicken curry used for all curry/karahi variants; restaurant karahi is usually oilier."
  haleem:
    db: fndds
    id: 2707463
    serving: "1 cup"
    approximate: true
    note: "No haleem entry in FNDDS, SR Legacy, UK CoFID 2021 or INDB. Stand-in: lentil soup with meat. Haleem is thicker (wheat, lentils, meat, ghee), so this likely UNDER-estimates calories."
  chicken_tikka:
    db: cofid
    id: "19-540"
    serving_fndds: {id: 2705949, portion: "1 piece"}
    approximate: true
    crosscheck: {db: indb, id: ASC241}
    note: "UK CoFID 'Curry, chicken tandoori, retail, reheated'; no tikka/tandoori dish in FNDDS."
  pakora:         {db: fndds, id: 2710066, serving: "Quantity not specified", approximate: false, crosscheck: {db: cofid, id: "15-620"}}
  chana_chole:
    db: cofid
    id: "15-108"
    serving_fndds: {id: 2707427, portion: "1 cup"}
    approximate: true
    crosscheck: {db: indb, id: ASC162}
    note: "UK CoFID Punjabi chickpea curry (vegetable oil). Puri/bhatura served with it is NOT included."
  jalebi:
    db: fndds
    id: 2708349
    serving: "Quantity not specified"
    approximate: true
    note: "No jalebi entry in FNDDS, SR Legacy, UK CoFID 2021 or INDB. Stand-in: funnel cake with sugar (fried batter + sugar). Syrup-soaked jalebi is likely denser; treat as rough."
  gulab_jamun:
    db: cofid
    id: "11-1081"
    serving_indb: {code: ASC348}
    approximate: true
    crosscheck: {db: indb, id: ASC348}
    note: "UK CoFID 'Gulab jamen/jambu, homemade'. Default serving = INDB '2 gulab jamun' (with syrup)."
  chai:
    db: fndds
    id: 2710506
    serving: "1 cup"
    approximate: true
    note: "FNDDS 'Tea, hot, with milk' has no sugar; Pakistani doodh patti with sugar is higher."
  paratha_roll:
    db: indb
    id: ASC149
    serving_indb: {code: ASC149}
    approximate: true
    note: "INDB 'Paneer kaathi roll' (recipe-calculated); chicken paratha rolls differ in filling."
  gol_gappay:
    db: cofid
    id: "11-911"
    serving_fndds: {id: 2707714, portion: "Quantity not specified"}
    approximate: true
    note: "No pani puri entry found. Stand-in: UK CoFID 'Puri, homemade' (the fried shell only); a served plate with filling and water has lower energy density."
  halwa:
    db: cofid
    id: "17-799"
    serving_indb: {code: ASC293}
    approximate: true
    crosscheck: {db: indb, id: ASC293}
    note: "UK CoFID 'Halva, semolina, homemade' (suji halwa). Gajar halwa (17-798) is similar per 100 g."
  kulfi:
    db: cofid
    id: "12-606"
    serving_fndds: {id: 2705638, portion: "1 bar"}
    approximate: true
    crosscheck: {db: indb, id: ASC321}
    note: "UK CoFID 'Kulfi, homemade'. Sources disagree strongly with INDB. Serving = FNDDS ice cream bar (INDB's 266 g serving is implausible for one kulfi). Verify before production."
  pizza:          {db: fndds, id: 2708614, serving: "1 piece, medium pizza", approximate: false}
  burger:         {db: fndds, id: 2706920, serving: "1 hamburger", approximate: false}
  french_fries:   {db: fndds, id: 2709461, serving: "1 medium fast food order", approximate: false}
  fried_rice:     {db: fndds, id: 2708953, serving: "1 cup", approximate: false, crosscheck: {db: cofid, id: "11-444"}}
  omelette:       {db: fndds, id: 2707200, serving: "Quantity not specified", approximate: false}
  fried_chicken:  {db: fndds, id: 2705949, serving: "1 piece", approximate: false}
  sandwich:       {db: fndds, id: 2706993, serving: "1 sandwich, any size", approximate: false}
  hot_dog:        {db: fndds, id: 2707056, serving: "1 sandwich", approximate: false}
  donut:          {db: fndds, id: 2708062, serving: "1 doughnut", approximate: false}
  ice_cream:      {db: fndds, id: 2705629, serving: "1 scoop", approximate: false}
  chocolate_cake: {db: fndds, id: 2707866, serving: "1 regular or small piece/slice, 1 layer cake", approximate: false}
  spaghetti:
    db: fndds
    id: 2708837
    serving: "1 cup"
    approximate: true
    note: "FNDDS 'Pasta with tomato-based sauce and meat, restaurant' (bolognese-type); carbonara (cream sauce) is higher in fat."
  salad:
    db: fndds
    id: 2709830
    serving: "1 cup"
    approximate: true
    note: "Greek salad WITHOUT dressing; dressing adds substantial fat/calories."
